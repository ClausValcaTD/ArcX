# .github/workflows/release.yml
name: Release ArcX

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: write  # ← ده المهم!

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      
      - name: Android SDK
        uses: android-actions/setup-android@v3
      
      - name: NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26c
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle*') }}
      
      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      
      - name: Rename APK
        run: |
          mv app/build/outputs/apk/debug/app-debug.apk ArcX-v${{ github.event.inputs.version }}.apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v2  # ← updated to v2
        with:
          tag_name: v${{ github.event.inputs.version }}
          name: ArcX v${{ github.event.inputs.version }}
          body: |
            ## ArcX v${{ github.event.inputs.version }}
            
            ### Features
            - Extract: ZIP, 7Z, RAR, TAR
            - Create: ZIP (AES-256), 7Z, TAR
            - Background extraction with notifications
            - Material 3 UI with dynamic colors
            - Settings with DataStore
            
            ### Supported Android
            - Android 7.0+ (API 24+)
            
            ### Note
            This is a debug build for beta testing.
          files: ArcX-v${{ github.event.inputs.version }}.apk
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
